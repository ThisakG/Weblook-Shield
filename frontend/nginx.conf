# ------------------------------------------------------------------------
# nginx.conf — serves the built React SPA and proxies /api to the backend
# container by service name (see docker-compose.yml), so the browser only
# ever talks to ONE origin in production, sidestepping any CORS
# configuration entirely for the containerized deployment path.
# ------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path serves index.html so React Router can
    # handle client-side routes like /policies/:id on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Basic security headers at the edge, in addition to helmet() on the API.
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
